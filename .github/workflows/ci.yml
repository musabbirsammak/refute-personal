name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test
      - name: Build with example settings
        run: cp .env.example .env && npm run build && test -f dist/js/config.js

  database:
    name: Database security rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/supabase_shim.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261122000000_initial_schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261122000000_initial_schema.sql   # must be safe to re-run
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
