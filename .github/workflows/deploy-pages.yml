# Optional: publish your copy of Refute on GitHub Pages.
# 1. Settings → Pages → Source: GitHub Actions.
# 2. Settings → Secrets and variables → Actions → Variables: add
#    SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, and optionally REFUTE_APP_NAME
#    and REFUTE_SOURCE_URL.
#    (These values are public anyway, so repository variables are fine. Never add
#    a Supabase secret key.)
# The job is skipped until a database address is set, so forks don't fail.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.SUPABASE_URL != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          REFUTE_APP_NAME: ${{ vars.REFUTE_APP_NAME }}
          REFUTE_SOURCE_URL: ${{ vars.REFUTE_SOURCE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
